name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate Next.js route types (LayoutProps etc.)
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Unit and SQL tests (no secrets, no network)
        run: npm test
